[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnull-framework"
version = "1.0.1"
description = "Causal Transparency Algebra (ℝ_∅) & ∅-Net Framework: Dual-Tensor PyTorch emulator, drift-free continual learning, multimodal fusion, and Verilog RTL neuromorphic MAC."
readme = "README.md"
authors = [
    { name = "Hakim Guettal" }
]
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = [
    "causal-transparency-algebra",
    "rnull",
    "null-net",
    "neuromorphic-computing",
    "continual-learning",
    "epistemic-abstention"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
    "numpy>=1.22.0",
    "torch>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.urls]
Homepage = "https://github.com/GuettHM/rnull-framework"
Repository = "https://github.com/GuettHM/rnull-framework"
Releases = "https://github.com/GuettHM/rnull-framework/releases/tag/v1.0.1"
DOI = "https://doi.org/10.5281/zenodo.24175268"

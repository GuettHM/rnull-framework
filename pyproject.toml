[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rnull-framework"
version = "1.1.0"
description = "Masked real arithmetic with a null element that is the identity of both addition and multiplication: NumPy reference, PyTorch layers, and a tagged Verilog MAC cell."
readme = "README.md"
authors = [
    { name = "Hakim Guettal" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    "missing-data",
    "masked-arrays",
    "sensor-fusion",
    "sparse-neural-networks",
    "continual-learning",
    "verilog"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
    "numpy>=1.22.0"
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0"
]
dev = [
    "pytest>=7.0.0"
]

[project.urls]
Homepage = "https://github.com/GuettHM/rnull-framework"
Repository = "https://github.com/GuettHM/rnull-framework"
Changelog = "https://github.com/GuettHM/rnull-framework/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.24215450"

[tool.setuptools]
packages = ["rnull"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "autograd: needs PyTorch autograd or torch.optim",
]
